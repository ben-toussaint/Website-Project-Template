<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dist/output.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Website project template</title>
    <script src="script.js" defer></script>
    <script src="src/js/shape-scroll-animation.js" defer></script>
  </head>
  <script>
    const loadComponents = (id, url, callback) => {
      return fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
          if (callback) callback();
        });
    };

    window.onload = () => {
      loadComponents("header", "./src/sections/header.html", togglenav);
      loadComponents("hero", "./src/sections/hero.html").then(() =>
        window.initShapeScrollAnimation(),
      );
      loadComponents("contact", "./src/sections/contact.html");
      loadComponents("footer", "./src/sections/footer.html");
    };
  </script>
  <body>
    <div id="header"></div>
    <div id="hero"></div>
    <div id="contact"></div>
    <div id="footer"></div>
    
</body>
</html>
